; Star Wars: The Force Unleashed Raw Mouse Fix
; Keep this file beside SWTFURawMouseFix.asi (in the game's scripts folder).

[Fix]
; 1 = load the fix; 0 = leave the game completely unmodified.
Enabled=1
; 1 = the camera turns by raw mouse counts (no acceleration, the same turn per count at any
;     frame rate); 0 = the game's own handling. Keyboard and mouse mode only.
DirectCamera=1
; 1 = in game hotkeys (see [Hotkeys]).
Hotkeys=1
; 1 = write input statistics to swtfu-raw-mouse-fix.log every five seconds.
Diagnostics=0

[Sensitivity]
; Camera turn per mouse count, in thousandths of a degree: 50 = 0.05 degrees per count,
; 7200 counts for a full turn (22.9 cm at 800 DPI). Higher turns faster.
SensitivityX=50
SensitivityY=50
; Scales both of the above. 1.00 = as they are.
SensitivityMultiplier=1.00

[Hotkeys]
; F1..F24, a virtual-key code (0x75), or none.
ReloadIni=F6
ToggleFix=F8
MultiplierDown=F9
MultiplierUp=F10
